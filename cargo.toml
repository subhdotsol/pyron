[workspace]
members = [
    "pyron",
    "crates/pyron-parser",
    "crates/pyron-sim",
    "crates/pyron-report",
    "crates/pyron-ai",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
indicatif = "0.17"
solana-client = "2.1"
solana-sdk = "2.1"
solana-transaction-status = "2.1"
